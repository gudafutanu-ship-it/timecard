<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タイムカード残業計算</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;margin:16px;background:#f7f7f7}
h2{margin-bottom:8px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}
input,button{font-size:16px;padding:8px}
button{border-radius:10px;border:1px solid #ccc;background:#fff;cursor:pointer;margin:4px}
button.primary{background:#2563eb;color:#fff;border-color:#2563eb}
button.calc{background:#dc2626;color:#fff;border-color:#dc2626}
button.save{background:#16a34a;color:#fff;border-color:#16a34a}
table{border-collapse:collapse;width:100%;margin-top:12px;background:#fff}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#e5e7eb}
td input{width:90px;text-align:center}
tr.overtime{background:#fff7cc}
.endInput{font-size:20px;font-weight:bold;color:#b91c1c}
.ot{font-weight:bold;color:#b91c1c}
.pay{font-weight:bold}
.total{font-size:22px;font-weight:bold;color:#b91c1c;margin-top:12px}
.saved{font-size:18px;font-weight:bold;color:#166534;line-height:1.7}
#status{margin-top:8px;color:#065f46;font-weight:bold}
.note{font-size:13px;color:#555;line-height:1.6}
</style>
</head>
<body>

<h2>タイムカード残業計算 Ver.1.1</h2>

<div class="card">
  <p class="note">
    ① 表面を読み取り → 修正 →「表を確定」<br>
    ② 裏面を読み取り → 修正 →「残業計算」<br>
    ③ 表＋裏の合計が表示されます
  </p>

  <p>8桁パスワード</p>
  <input id="password" type="password" maxlength="8" inputmode="numeric" placeholder="8桁数字">

  <p>タイムカード写真</p>
  <input type="file" id="files" accept="image/*" multiple>

  <p>残業単価</p>
  <input id="rate" type="number" value="1200"> 円 / 時間

  <br><br>
  <button class="primary" onclick="analyze()">① AIで読み取り</button>
  <button class="calc" onclick="calc()">② 残業計算</button>
  <button class="save" onclick="saveFront()">表を確定</button>
  <button onclick="clearCurrent()">現在の表をクリア</button>
  <button onclick="clearAll()">全部クリア</button>

  <div id="status"></div>
</div>

<div class="card">
  <div class="saved" id="savedFront">
    表の確定：まだありません
  </div>
</div>

<div class="card">
  <p class="note">
    ※ 黄色の行が残業対象です。<br>
    ※ 時間を修正すると、自動で残業時間・金額が変わります。<br>
    ※ 残業は18:30以降、10分単位切り捨てです。
  </p>

  <table id="table">
    <thead>
      <tr>
        <th>確認</th>
        <th>日付</th>
        <th>出勤</th>
        <th>退勤<br>※確認</th>
        <th>残業時間</th>
        <th>残業代</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <p class="total" id="currentTotal"></p>
  <p class="total" id="grandTotal"></p>
</div>

<script>
const WORKER_URL = "https://timecard-ai.gudafutanu.workers.dev";

let savedMinutes = 0;
let savedPay = 0;

function timeToMin(t){
  if(!t) return null;
  t = String(t).replace(/[：.]/g, ":").trim();

  if(/^\d{3,4}$/.test(t)){
    const s = t.padStart(4,"0");
    return Number(s.slice(0,2))*60 + Number(s.slice(2));
  }

  const m = t.match(/(\d{1,2})[:時]?(\d{2})?/);
  if(!m) return null;

  const h = Number(m[1]);
  const min = m[2] ? Number(m[2]) : 0;
  if(h < 0 || h > 23 || min < 0 || min > 59) return null;

  return h * 60 + min;
}

function minToHour(min){
  return Math.floor(min/60) + ":" + String(min%60).padStart(2,"0");
}

async function fileToBase64(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });
}

async function analyze(){
  const password = document.getElementById("password").value.trim();
  if(!/^\d{8}$/.test(password)){
    alert("8桁の数字パスワードを入力してください");
    return;
  }

  const files = document.getElementById("files").files;
  if(!files.length){
    alert("写真を選んでください");
    return;
  }

  document.getElementById("status").textContent = "AI読み取り中です…";

  const images = [];
  for(const f of files){
    images.push(await fileToBase64(f));
  }

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ password, images })
    });

    if(res.status === 403){
      alert("パスワードが違います");
      return;
    }

    const data = await res.json();

    if(!data.days){
      alert("読み取りに失敗しました");
      console.log(data);
      return;
    }

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    data.days.forEach(d=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input type="checkbox" checked onchange="calc()"></td>
        <td><input value="${d.date ?? ""}" oninput="calc()"></td>
        <td><input value="${d.start ?? ""}" oninput="calc()"></td>
        <td><input class="endInput" value="${d.end ?? ""}" oninput="calc()"></td>
        <td class="ot"></td>
        <td class="pay"></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("status").textContent =
      "読み取り完了。退勤時間を確認してください。";

    calc();

  }catch(e){
    alert("通信エラーです。Worker URLやネット接続を確認してください。");
    console.error(e);
  }
}

function calc(){
  const rate = Number(document.getElementById("rate").value || 0);
  const base = 18*60 + 30;

  let currentMin = 0;
  let currentPay = 0;

  document.querySelectorAll("#table tbody tr").forEach(tr=>{
    const checked = tr.querySelector("input[type=checkbox]").checked;
    const inputs = tr.querySelectorAll("td input");
    const endInput = inputs[3];
    const end = timeToMin(endInput.value);

    let ot = 0;

    if(checked && end && end > base){
      ot = end - base;
      ot = Math.floor(ot / 10) * 10;
    }

    const pay = Math.floor((ot / 60) * rate);

    tr.querySelector(".ot").textContent = ot ? minToHour(ot) : "";
    tr.querySelector(".pay").textContent = pay ? pay.toLocaleString()+"円" : "";

    if(ot > 0){
      tr.classList.add("overtime");
    }else{
      tr.classList.remove("overtime");
    }

    currentMin += ot;
    currentPay += pay;
  });

  document.getElementById("currentTotal").textContent =
    `現在の表：${minToHour(currentMin)}　${currentPay.toLocaleString()}円`;

  document.getElementById("grandTotal").textContent =
    `表＋裏 合計：${minToHour(savedMinutes + currentMin)}　${(savedPay + currentPay).toLocaleString()}円`;

  return { currentMin, currentPay };
}

function saveFront(){
  const result = calc();

  savedMinutes = result.currentMin;
  savedPay = result.currentPay;

  document.getElementById("savedFront").innerHTML =
    `表を確定しました<br>残業時間：${minToHour(savedMinutes)}<br>残業代：${savedPay.toLocaleString()}円`;

  alert("表を確定しました。次に裏面を読み取ってください。");
}

function clearCurrent(){
  if(!confirm("現在の表だけクリアしますか？")) return;
  document.querySelector("#table tbody").innerHTML = "";
  document.getElementById("currentTotal").textContent = "";
  calc();
}

function clearAll(){
  if(!confirm("表の確定分も含めて全部クリアしますか？")) return;
  savedMinutes = 0;
  savedPay = 0;
  document.querySelector("#table tbody").innerHTML = "";
  document.getElementById("savedFront").textContent = "表の確定：まだありません";
  document.getElementById("currentTotal").textContent = "";
  document.getElementById("grandTotal").textContent = "";
  document.getElementById("status").textContent = "";
}
</script>

</body>
</html>
