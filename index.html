<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>タイムカード残業計算</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{font-family:sans-serif;margin:16px}
table{border-collapse:collapse;width:100%;margin-top:12px}
td,th{border:1px solid #ccc;padding:6px;text-align:center}
input{font-size:16px;padding:6px}
td input{width:80px}
button{padding:10px 16px;margin:6px;font-size:16px}
.total{font-size:22px;font-weight:bold;color:#c00}
#status{margin:10px 0;color:#064}
</style>
</head>
<body>

<h2>タイムカード残業計算</h2>

<p>8桁パスワード</p>
<input id="password" type="password" maxlength="8" inputmode="numeric" placeholder="8桁数字">

<p>表面・裏面のタイムカード写真を選んでください。</p>
<input type="file" id="files" accept="image/*" multiple>

<br>
<button onclick="analyze()">① AIで読み取り</button>
<button onclick="calc()">② 残業計算</button>

<p>残業単価：</p>
<input id="rate" type="number" value="1200"> 円 / 時間

<div id="status"></div>

<table id="table">
<thead>
<tr>
<th>日付</th>
<th>出勤</th>
<th>退勤</th>
<th>残業時間</th>
<th>残業代</th>
</tr>
</thead>
<tbody></tbody>
</table>

<p class="total" id="total"></p>

<script>
const WORKER_URL = "https://timecard-ai.gudafutanu.workers.dev/analyze";

function timeToMin(t){
  if(!t) return null;
  t = String(t).replace(/[：.]/g, ":").trim();
  const m = t.match(/(\d{1,2})[:時]?(\d{2})?/);
  if(!m) return null;
  return Number(m[1]) * 60 + (m[2] ? Number(m[2]) : 0);
}

function minToHour(min){
  return Math.floor(min/60) + ":" + String(min%60).padStart(2,"0");
}

async function fileToBase64(file){
  return new Promise(resolve=>{
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.readAsDataURL(file);
  });
}

async function analyze(){
  const password = document.getElementById("password").value.trim();
  if(!/^\d{8}$/.test(password)){
    alert("8桁の数字パスワードを入力してください");
    return;
  }

  const files = document.getElementById("files").files;
  if(!files.length){
    alert("写真を選んでください");
    return;
  }

  document.getElementById("status").textContent = "AI読み取り中です。少し待ってください…";

  const images = [];
  for(const f of files){
    images.push(await fileToBase64(f));
  }

  try{
    const res = await fetch(WORKER_URL,{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({ password, images })
    });

    if(res.status === 403){
      alert("パスワードが違います");
      document.getElementById("status").textContent = "パスワードエラー";
      return;
    }

    const data = await res.json();

    if(!data.days){
      document.getElementById("status").textContent = "読み取りに失敗しました";
      console.log(data);
      return;
    }

    const tbody = document.querySelector("#table tbody");
    tbody.innerHTML = "";

    data.days.forEach(d=>{
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td><input value="${d.date ?? ""}"></td>
        <td><input value="${d.start ?? ""}"></td>
        <td><input value="${d.end ?? ""}"></td>
        <td class="ot"></td>
        <td class="pay"></td>
      `;
      tbody.appendChild(tr);
    });

    document.getElementById("status").textContent =
      "読み取り完了。間違いがあれば表を修正してから残業計算してください。";

  }catch(e){
    document.getElementById("status").textContent = "通信エラー";
    alert("通信エラーです。Worker URLやネット接続を確認してください。");
    console.error(e);
  }
}

function calc(){
  const rate = Number(document.getElementById("rate").value || 0);
  const base = 18*60 + 30;
  let totalMin = 0;
  let totalPay = 0;

  document.querySelectorAll("#table tbody tr").forEach(tr=>{
    const inputs = tr.querySelectorAll("input");
    const end = timeToMin(inputs[2].value);

    let ot = 0;
    if(end && end > base){
      ot = end - base;
      ot = Math.floor(ot / 10) * 10;
    }

    const pay = Math.floor((ot / 60) * rate);

    tr.querySelector(".ot").textContent = ot ? minToHour(ot) : "";
    tr.querySelector(".pay").textContent = pay ? pay.toLocaleString()+"円" : "";

    totalMin += ot;
    totalPay += pay;
  });

  document.getElementById("total").textContent =
    `合計残業時間：${minToHour(totalMin)}　合計残業代：${totalPay.toLocaleString()}円`;
}
</script>

</body>
</html>
